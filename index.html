<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contador</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Contador js</h1>
      <div class="valorActual">
        <h2>Valor Actual</h2>
        <p id="contador">0</p>
        <p class="pista">
          Suma <span id="numeroSumar"></span> · Resta
          <span id="numeroRestar"></span>
        </p>
      </div>
      <div class="botones">
        <button type="button" id="sumar">+ Sumar</button>
        <div class="botonesSecundarios">
          <button type="button" id="restar">Restar</button>
          <button type="button" id="reiniciar">Reiniciar</button>
        </div>
      </div>

      <script src="script.js"></script>
    </main>
  </body>
</html>
